    <script>
      (function() {
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr =
              (typeof protocols === 'string' && protocols.startsWith('vite-')) ||
              (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.startsWith('vite-'); })) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('@vite')));

            if (isViteHmr) {
              const fakeSocket = new EventTarget();
              fakeSocket.url = String(url);
              fakeSocket.protocol = Array.isArray(protocols) ? protocols[0] || '' : (protocols || '');
              fakeSocket.readyState = 1;
              fakeSocket.OPEN = 1;
              fakeSocket.CLOSED = 3;
              fakeSocket.CLOSING = 2;
              fakeSocket.CONNECTING = 0;
              fakeSocket.bufferedAmount = 0;
              fakeSocket.extensions = '';
              fakeSocket.binaryType = 'blob';
              fakeSocket.send = function() {};
              fakeSocket.close = function() {};

              setTimeout(function() {
                const openEvent = new Event('open');
                fakeSocket.dispatchEvent(openEvent);
                if (typeof fakeSocket.onopen === 'function') {
                  fakeSocket.onopen(openEvent);
                }
              }, 0);

              return fakeSocket;
            }

            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && (typeof event.reason === 'string' ? event.reason.includes('WebSocket') : event.reason?.message?.includes('WebSocket'))) {
            event.preventDefault();
          }
        });
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
            event.preventDefault();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
